name: ci
on:
  push:
    branches:
      - main
      - release/**
  pull_request:

jobs:
  lint:
    name: "Linting"
    # setup-python has no Python 3.8 (.python-version) build for ubuntu-26.04, which ubuntu-latest now is.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

      - run: make develop
      - run: make lint
      - run: make format
      - run: git diff --quiet || (echo '::error ::lint produced file changes, run linter locally and try again' && exit 1)
  test:
    name: "Tests"

    # Same Python 3.8 constraint as lint; ubuntu-26.04 also has no docker-compose v1 package.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      max-parallel: 4
      matrix:
        redis-py: [3.*, 4.*]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

      - name: Install redis-cli
        run: sudo apt-get update
      - run: sudo apt-get install redis-tools
      - run: sudo apt-get install -y docker-compose
      - run: make develop
      - run: make redis-cluster
      - run: pip install redis==${{ matrix.redis-py }}
      - run: make test
