---
version: '3'
services:
  redis-cluster:
    image: grokzen/redis-cluster:7.0.10
    ports:
      - '16379-16384:16379-16384'
    environment:
      IP: '0.0.0.0'
      INITIAL_PORT: 16379

  redis-sentinel:
    image: grokzen/redis-cluster:7.0.10
    ports:
      - '21379:21379'
      - '23379:23379'
      - '23385-23386:23385-23386'
    environment:
      IP: '0.0.0.0'
      INITIAL_PORT: 23379
      SENTINEL: 'true'
      STANDALONE: 'true'
      LC_ALL: C  # sentinel is sensitive to missing locales

  single-redis:
    image: redis
    ports:
      - '6379:6379'
