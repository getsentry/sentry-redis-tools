---
version: '3'
services:
  redis-cluster:
    image: ghcr.io/getsentry/image-mirror-valkey-valkey:8.0.12
    command:
      - sh
      - -c
      - |
        rm -f nodes-*.conf
        for p in 16379 16380 16381; do
          valkey-server --port $$p --protected-mode no --cluster-enabled yes \
            --cluster-config-file nodes-$$p.conf --save '' &
        done
        for p in 16379 16380 16381; do until valkey-cli -p $$p ping >/dev/null 2>&1; do sleep 0.1; done; done
        valkey-cli --cluster create 127.0.0.1:16379 127.0.0.1:16380 127.0.0.1:16381 --cluster-yes
        wait
    ports:
      - '127.0.0.1:16379-16381:16379-16381'

  single-redis:
    image: redis
    ports:
      - '6379:6379'
